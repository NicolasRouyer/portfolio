<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mon site</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; background: #fff; color: #000; }
  body { font-family: Arial, Helvetica, sans-serif; font-size: 12px; line-height: 1.3; }
  a { color: inherit; font-family: 'Times New Roman', Times, serif; font-style: italic; text-decoration: underline; }

  .site-header { padding: 56px 48px 40px; }
  .site-title { font-weight: 400; text-transform: uppercase; word-break: break-word; }

  :root { --feed-pad: 48px; --feed-gap: 16px; }

  /* Masonry: auto-fill computes the column count live from the available
     width (like Pinterest resizing), every track is the same fixed width,
     and each card's row-span is measured in JS so heights pack tightly
     without any manual breakpoints. */
  .feed {
    display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
    grid-auto-rows: 1px; gap: var(--feed-gap); align-items: start;
    padding: 0 var(--feed-pad) 80px;
  }
  .card.text { grid-column: span 2; background: #f2e6b8; padding: 20px; border-radius: 2px; }
  .card.img-large { grid-column: span 2; }
  .card.full { grid-column: 1 / -1; margin-left: calc(-1 * var(--feed-pad)); margin-right: calc(-1 * var(--feed-pad)); }
  .card.spacer { visibility: hidden; }
  .card img { width: 100%; height: auto; display: block; border-radius: 2px; }
  .card .caption { margin: 8px 0 0 0; }

  .text-content { max-width: 34em; }
  .text-content p { margin: 0 0 18px 0; }
  .text-content h2 { font-size: 1em; font-weight: 400; margin: 50px 0 14px 0; }
  .text-content h3 { font-size: 1em; font-weight: 400; margin: 30px 0 10px 0; }
  .text-content blockquote { font-weight: 400; margin: 38px 0 22px 0; padding: 0; }
  .text-content ul, .text-content ol { margin: 0 0 18px 0; padding-left: 22px; }
  .text-content > *:first-child { margin-top: 0; }

  .muted { font-style: normal; padding: 0 48px; }

  @media (max-width: 900px) {
    :root { --feed-pad: 28px; }
    .feed { padding: 0 var(--feed-pad) 56px; }
    .site-header { padding: 40px 28px 32px; }
  }
  @media (max-width: 560px) {
    :root { --feed-pad: 20px; }
    .feed { padding: 0 var(--feed-pad) 40px; }
    .site-header { padding: 32px 20px 24px; }
    .muted { padding: 0 20px; }
  }
</style>
</head>
<body>

<div id="app"><div class="muted" style="padding-top:40px;">Chargement…</div></div>

<script>
(function () {
  var siteData = null;

  function escapeHtml(str) {
    var d = document.createElement('div');
    d.textContent = str == null ? '' : String(str);
    return d.innerHTML;
  }
  function escapeAttr(str) {
    return escapeHtml(str).replace(/"/g, '&quot;').replace(/'/g, '&#39;');
  }

  // Retries images that briefly 404 right after GitHub Pages redeploys.
  window.handleImgError = function (img) {
    var tries = parseInt(img.getAttribute('data-retry') || '0', 10);
    if (tries >= 15) return;
    img.setAttribute('data-retry', String(tries + 1));
    var base = img.getAttribute('data-base-src') || img.src;
    img.setAttribute('data-base-src', base);
    setTimeout(function () { img.src = base + '?r=' + Date.now(); }, 4000);
  };

  function sortedPosts() {
    return (siteData.posts || []).slice().sort(function (a, b) {
      if (a.date !== b.date) return a.date < b.date ? 1 : -1;
      return (b.createdAt || 0) - (a.createdAt || 0);
    });
  }

  function renderCard(post) {
    if (post.type === 'image') {
      var size = post.size === 'small' || post.size === 'full' ? post.size : 'large';
      var cls = size === 'full' ? 'card full' : size === 'large' ? 'card img-large' : 'card';
      return '<article class="' + cls + '">' +
        '<img src="' + escapeAttr(post.src) + '" alt="" onerror="handleImgError(this)">' +
        (post.caption ? '<p class="caption">' + escapeHtml(post.caption) + '</p>' : '') +
        '</article>';
    }
    return '<article class="card text">' +
      '<div class="text-content">' + (post.content || '') + '</div>' +
      '</article>';
  }

  // Blank, column-aligned filler blocks — re-rolled on every page load so
  // the layout never packs identically twice, without breaking the grid.
  function renderSpacer() {
    var span = Math.random() < 0.25 ? 2 : 1;
    var height = 60 + Math.floor(Math.random() * 220);
    return '<div class="card spacer" style="grid-column: span ' + span + '; height: ' + height + 'px;" aria-hidden="true"></div>';
  }

  // ---- Masonry packing (CSS Grid "row-span hack", explicit columns) ----
  // Rather than letting the grid auto-place cards (which gives no control
  // over which column a card lands in), we compute each card's column
  // ourselves — shortest column first, like Pinterest — so we can also
  // enforce a rule CSS auto-placement can't express: a text card is never
  // routed on top of another text card in the same column.
  function layoutMasonry() {
    var feed = document.querySelector('.feed');
    if (!feed) return;
    var styles = getComputedStyle(feed);
    var rowUnit = parseFloat(styles.getPropertyValue('grid-auto-rows')) || 1;
    var gap = parseFloat(styles.getPropertyValue('column-gap') || styles.getPropertyValue('gap')) || 0;
    var containerWidth = feed.clientWidth;
    var colTarget = 240; // keep in sync with grid-template-columns minmax()
    var colCount = Math.max(1, Math.floor((containerWidth + gap) / (colTarget + gap)));

    var cards = Array.prototype.slice.call(feed.children);

    // Pass 1: reset explicit placement and measure each card's natural
    // height — width is already correct at this point (span comes from
    // its CSS class), only the row position is still auto so far.
    cards.forEach(function (card) { card.style.gridColumn = ''; card.style.gridRow = ''; });
    var heights = cards.map(function (card) { return card.getBoundingClientRect().height; });

    // Pass 2: assign each card to explicit columns.
    var colHeights = new Array(colCount).fill(0);
    var colLastType = new Array(colCount).fill(null);

    cards.forEach(function (card, i) {
      var isText = card.classList.contains('text');
      var isFull = card.classList.contains('full');
      var wantsWide = isText || card.classList.contains('img-large');
      var span = isFull ? colCount : Math.min(wantsWide ? 2 : 1, colCount);
      var height = heights[i];

      var start, stillBlocked = false;
      if (span >= colCount) {
        start = 0;
      } else if (span === 1) {
        start = colHeights.indexOf(Math.min.apply(null, colHeights));
      } else {
        // A wide card starts at the tallest column it spans, leaving a
        // notch in the shorter one whenever the pair isn't already level.
        // Rank candidates by imbalance first (so a level pair always wins
        // over a merely-shorter one) and only use total height to break
        // ties between equally level candidates.
        var bestStart = 0, bestImbalance = Infinity, bestMax = Infinity, bestBlocked = true;
        for (var s = 0; s + span <= colCount; s++) {
          var segment = colHeights.slice(s, s + span);
          var segMax = Math.max.apply(null, segment);
          var segMin = Math.min.apply(null, segment);
          var imbalance = segMax - segMin;
          var blocked = isText && colLastType.slice(s, s + span).indexOf('text') !== -1;
          var better = blocked !== bestBlocked
            ? (bestBlocked && !blocked)
            : (imbalance < bestImbalance) || (imbalance === bestImbalance && segMax < bestMax);
          if (better) { bestImbalance = imbalance; bestMax = segMax; bestStart = s; bestBlocked = blocked; }
        }
        start = bestStart;
        stillBlocked = bestBlocked; // every pair had a text neighbour — rare, but possible
      }

      var top = 0;
      for (var k = start; k < start + span; k++) top = Math.max(top, colHeights[k]);
      // Even in that rare case, don't let it read as one continuous block —
      // force a visible break instead of just the normal grid gap.
      if (stillBlocked) top += 50 + Math.floor(Math.random() * 80);

      var rowStart = Math.round(top / (rowUnit + gap)) + 1;
      var rowSpan = Math.ceil((height + gap) / (rowUnit + gap));
      card.style.gridColumn = (start + 1) + ' / span ' + span;
      card.style.gridRow = rowStart + ' / span ' + rowSpan;

      var newHeight = top + height + gap;
      var type = isText ? 'text' : (card.classList.contains('spacer') ? null : 'other');
      for (var k2 = start; k2 < start + span; k2++) {
        colHeights[k2] = newHeight;
        colLastType[k2] = type;
      }
    });
  }

  function waitForImages(container) {
    var imgs = Array.prototype.slice.call(container.querySelectorAll('img'));
    return Promise.all(imgs.map(function (img) {
      if (img.complete) return Promise.resolve();
      return new Promise(function (resolve) {
        img.addEventListener('load', resolve, { once: true });
        img.addEventListener('error', resolve, { once: true });
      });
    }));
  }

  var resizeTimer;
  window.addEventListener('resize', function () {
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(layoutMasonry, 150);
  });

  function render() {
    document.title = siteData.siteTitle || 'Mon site';
    var posts = sortedPosts();
    // Re-rolled every load, so how sparse or busy the blank blocks feel
    // varies from one visit to the next. Keeping two text posts apart is
    // now handled by layoutMasonry's column routing, not by forcing a gap
    // here (which couldn't guarantee they'd land in the same column anyway).
    var spacerChance = 0.15 + Math.random() * 0.35;
    var cards = posts.map(function (post) {
      var spacer = Math.random() < spacerChance ? renderSpacer() : '';
      return spacer + renderCard(post);
    }).join('');

    document.getElementById('app').innerHTML =
      '<header class="site-header"><div class="site-title">' + escapeHtml(siteData.siteTitle || 'Mon site') + '</div></header>' +
      (cards
        ? '<main class="feed">' + cards + '</main>'
        : '<p class="muted">Aucun contenu pour le moment.</p>');

    var feed = document.querySelector('.feed');
    if (feed) waitForImages(feed).then(layoutMasonry);
  }

  fetch('data.json', { cache: 'no-store' })
    .then(function (res) {
      if (!res.ok) throw new Error('data.json introuvable');
      return res.json();
    })
    .then(function (data) {
      siteData = data;
      render();
    })
    .catch(function (e) {
      document.getElementById('app').innerHTML =
        '<div class="muted" style="padding-top:40px;">Impossible de charger data.json. ' +
        'Vérifiez qu\'il se trouve bien à côté de ce fichier index.html.<br><small>' +
        escapeHtml(e.message) + '</small></div>';
    });
})();
</script>

</body>
</html>
