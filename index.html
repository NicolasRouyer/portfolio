<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mon site</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; background: #fff; color: #000; }
  body { font-family: Arial, Helvetica, sans-serif; font-size: 12px; line-height: 1.3; }
  a { color: inherit; font-family: 'Times New Roman', Times, serif; font-style: italic; text-decoration: underline; }

  .site-header {
    padding: 56px 48px 40px; text-align: center;
    position: sticky; top: 0; z-index: 10; background: #fff;
  }
  .site-title { display: inline-block; font-weight: 400; text-transform: uppercase; word-break: break-word; }
  .title-glyph { display: inline-block; }

  :root { --feed-pad: 48px; --feed-gap: 16px; }

  /* Masonry: every card is positioned with an exact pixel top/left computed
     in JS (no CSS-grid row rounding), so the gap between any two touching
     cards — horizontal or vertical — is always exactly --feed-gap. Column
     count is recomputed from the container width on load and on resize,
     the same way Pinterest reflows. */
  .feed { position: relative; padding: 0 var(--feed-pad); }
  .card { position: absolute; }
  .card.text { padding: 20px; border-radius: 2px; }
  .card.spacer { visibility: hidden; }
  .card img { width: 100%; height: auto; display: block; border-radius: 2px; }
  /* Plein écran stays edge-to-edge by design — only small/large cards get
     the photo shrunk within its reserved block. */
  .card:not(.full) img { width: 50%; margin: 0 auto; }
  .card .caption { margin: 8px 0 0 0; }

  /* Left-aligned text has zero natural slack on its left — every line
     already starts flush at the block's edge, so there's nothing to give
     back for a leftward drift. This padding reserves genuine, equal room
     on both sides; drift is clamped to it so a line can visually return to
     the true edge but never past it. */
  .text-content { max-width: 34em; padding: 0 10%; }
  .text-content p { margin: 0 0 18px 0; }
  .text-content h2 { font-size: 1em; font-weight: 400; margin: 50px 0 14px 0; }
  .text-content h3 { font-size: 1em; font-weight: 400; margin: 30px 0 10px 0; }
  .text-content blockquote { font-weight: 400; margin: 38px 0 22px 0; padding: 0; }
  .text-content ul, .text-content ol { margin: 0 0 18px 0; padding-left: 22px; }
  .text-content > *:first-child { margin-top: 0; }
  .text-content > *:last-child { margin-bottom: 0; }
  .text-content i, .text-content em { font-family: 'Times New Roman', Times, serif; font-style: italic; }

  /* "Accidents": every real rendered line of every paragraph/list item
     drifts a little horizontally from the one before it, and occasionally
     tilts too. Bold is never rendered bold — every letter, whether it's a
     single word or a whole phrase, gets individually offset instead. */
  .line-drift { display: block; width: fit-content; }
  .line-tilt { display: inline-block; width: fit-content; }
  .accident-word { display: inline-block; font-weight: 400; }
  .glyph { display: inline-block; }

  .muted { font-style: normal; padding: 0 48px; }

  @media (max-width: 900px) {
    :root { --feed-pad: 28px; }
    .site-header { padding: 40px 28px 32px; }
  }
  @media (max-width: 560px) {
    :root { --feed-pad: 20px; }
    .site-header { padding: 32px 20px 24px; }
    .muted { padding: 0 20px; }
  }
</style>
</head>
<body>

<div id="app"><div class="muted" style="padding-top:40px;">Chargement…</div></div>

<script>
(function () {
  var siteData = null;

  function escapeHtml(str) {
    var d = document.createElement('div');
    d.textContent = str == null ? '' : String(str);
    return d.innerHTML;
  }
  function escapeAttr(str) {
    return escapeHtml(str).replace(/"/g, '&quot;').replace(/'/g, '&#39;');
  }

  // Retries images that briefly 404 right after GitHub Pages redeploys.
  window.handleImgError = function (img) {
    var tries = parseInt(img.getAttribute('data-retry') || '0', 10);
    if (tries >= 15) return;
    img.setAttribute('data-retry', String(tries + 1));
    var base = img.getAttribute('data-base-src') || img.src;
    img.setAttribute('data-base-src', base);
    setTimeout(function () { img.src = base + '?r=' + Date.now(); }, 4000);
  };

  function sortedPosts() {
    return (siteData.posts || []).slice().sort(function (a, b) {
      if (a.date !== b.date) return a.date < b.date ? 1 : -1;
      return (b.createdAt || 0) - (a.createdAt || 0);
    });
  }

  // Content pasted into the admin from elsewhere can carry its own inline
  // font/size/color and <span> wrappers, which would silently override the
  // site's typography. Strip that at render time so the public site always
  // matches the site's own style no matter what ends up in the data.
  function sanitizeContent(html) {
    var div = document.createElement('div');
    div.innerHTML = html || '';
    var walker = document.createTreeWalker(div, NodeFilter.SHOW_ELEMENT);
    var spans = [];
    var node;
    while ((node = walker.nextNode())) {
      node.removeAttribute('style');
      node.removeAttribute('class');
      if (node.tagName === 'SPAN') spans.push(node);
    }
    spans.forEach(function (span) {
      var parent = span.parentNode;
      if (!parent) return;
      while (span.firstChild) parent.insertBefore(span.firstChild, span);
      parent.removeChild(span);
    });
    return div.innerHTML;
  }

  function renderCard(post) {
    if (post.type === 'image') {
      var size = post.size === 'small' || post.size === 'full' ? post.size : 'large';
      var cls = size === 'full' ? 'card full' : size === 'large' ? 'card img-large' : 'card';
      return '<article class="' + cls + '">' +
        '<img src="' + escapeAttr(post.src) + '" alt="" onerror="handleImgError(this)">' +
        (post.caption ? '<p class="caption">' + escapeHtml(post.caption) + '</p>' : '') +
        '</article>';
    }
    return '<article class="card text">' +
      '<div class="text-content">' + sanitizeContent(post.content) + '</div>' +
      '</article>';
  }

  // ---- Bold/italic "accidents" ----
  // A <b> is never rendered bold. A single bold word has its letters
  // individually offset. A multi-word bold phrase tilts slightly within
  // whatever line it landed on. Every real rendered line of every paragraph
  // and list item — bold or not — also drifts a little horizontally from
  // the line before it. Re-derived from the pristine HTML every time
  // layoutMasonry runs, since a resize can change where lines break.
  var textOriginals = new WeakMap();
  function rand(min, max) { return Math.random() * (max - min) + min; }

  // Flattens a run of sibling nodes' text into document order, so a single
  // integer "flat position" can address any character across mixed markup
  // (plain text + <b>/<i> children) without caring which node it's in.
  function textNodesOfNodes(nodes) {
    var result = [];
    nodes.forEach(function (node) {
      if (node.nodeType === 3) { result.push(node); return; }
      if (node.nodeType === 1) {
        var walker = document.createTreeWalker(node, NodeFilter.SHOW_TEXT, null, false);
        var n;
        while ((n = walker.nextNode())) result.push(n);
      }
    });
    return result;
  }

  function flatPositionToBoundary(textNodes, pos) {
    var remaining = pos;
    for (var i = 0; i < textNodes.length; i++) {
      var len = textNodes[i].nodeValue.length;
      if (remaining <= len) return { node: textNodes[i], offset: remaining };
      remaining -= len;
    }
    var last = textNodes[textNodes.length - 1];
    return { node: last, offset: last ? last.nodeValue.length : 0 };
  }

  function childIndex(node) {
    return Array.prototype.indexOf.call(node.parentNode.childNodes, node);
  }

  // A <br> is a hard, unconditional line break — it doesn't need (and can't
  // use) geometry-based wrap detection. Splits a block's children into the
  // runs between successive <br>s, each processed as an independent segment
  // for wrap detection below; the <br>s themselves are left untouched.
  function getSegments(block) {
    var segments = [];
    var current = [];
    Array.prototype.forEach.call(block.childNodes, function (node) {
      if (node.nodeType === 1 && node.tagName === 'BR') {
        segments.push(current);
        current = [];
      } else {
        current.push(node);
      }
    });
    segments.push(current);
    return segments;
  }

  // Line splitting for one <br>-delimited segment, preserving inner markup.
  // Finds the DOM boundary (a collapsed Range) at the very start of each
  // rendered visual line, then slices the segment into one Range per line.
  // Each Range can span multiple nodes/elements (e.g. half a <b>), and
  // extractContents() on it correctly splits that markup at the boundary —
  // this is what lets a <b> phrase that wraps mid-word still render
  // correctly split across two line wrappers.
  //
  // Deliberately avoids caretRangeFromPoint/caretPositionFromPoint: both are
  // viewport-relative hit tests that return null for any point currently
  // scrolled off-screen — on a feed longer than one screenful that silently
  // failed for every card below the fold. getClientRects() has no such
  // limitation (it reports accurate coordinates for laid-out elements
  // regardless of scroll position), so boundaries are found instead by
  // binary-searching the flat character position where a line's rect top
  // first appears.
  function getSegmentLineBoundaries(block, nodes) {
    if (!nodes.length) return null;
    var textNodes = textNodesOfNodes(nodes);
    var totalLen = textNodes.reduce(function (sum, n) { return sum + n.nodeValue.length; }, 0);
    if (totalLen === 0) return null;

    var first = nodes[0], last = nodes[nodes.length - 1];
    var probe = document.createRange();
    probe.setStartBefore(first);
    probe.setEndAfter(last);
    var rawRects = Array.prototype.slice.call(probe.getClientRects());
    if (rawRects.length === 0) return null;

    // getClientRects() can report more than one rect for the SAME visual
    // line whenever the range crosses a style boundary (e.g. into a <b>) —
    // AND those rects are not guaranteed to arrive in reading order once a
    // wrapped <b> is involved (duplicate-looking, out-of-sequence rects
    // show up in practice). Sort by vertical position first, then cluster
    // by proximity — bold text's line box can sit a couple pixels off from
    // the regular text around it, so the tolerance is a fraction of the
    // real line height rather than a fixed couple of pixels.
    var lineHeight = parseFloat(getComputedStyle(block).lineHeight) || 20;
    var tolerance = lineHeight * 0.4;
    var sortedRects = rawRects.slice().sort(function (a, b) { return a.top - b.top; });
    var lines = [];
    sortedRects.forEach(function (r) {
      var lastLine = lines[lines.length - 1];
      if (lastLine && Math.abs(r.top - lastLine.top) < tolerance) return;
      lines.push({ top: r.top });
    });
    if (lines.length <= 1) return null;

    // Top of the single character at flat position pos.
    function topOfChar(pos) {
      var start = flatPositionToBoundary(textNodes, pos);
      var end = flatPositionToBoundary(textNodes, Math.min(pos + 1, totalLen));
      var r = document.createRange();
      r.setStart(start.node, start.offset);
      r.setEnd(end.node, end.offset);
      var rects = r.getClientRects();
      return rects.length ? rects[0].top : null;
    }

    var boundaries = [{ node: block, offset: childIndex(first) }];
    var searchFrom = 0;
    for (var i = 1; i < lines.length; i++) {
      var targetTop = lines[i].top;
      // Smallest flat position whose character's top has reached this
      // line — i.e. the first character that belongs to it.
      var lo = searchFrom, hi = totalLen;
      while (lo < hi) {
        var mid = (lo + hi) >> 1;
        var t = topOfChar(mid);
        if (t === null || t < targetTop - tolerance) lo = mid + 1;
        else hi = mid;
      }
      if (lo >= totalLen) return null; // couldn't resolve this boundary — bail
      boundaries.push(flatPositionToBoundary(textNodes, lo));
      searchFrom = lo;
    }
    boundaries.push({ node: block, offset: childIndex(last) + 1 });
    return boundaries;
  }

  function splitBlockIntoLines(block) {
    var segments = getSegments(block);
    var anySplit = false;
    // Process segments from the last back to the first so an earlier
    // segment's childIndex-based boundaries — computed relative to
    // `block`'s own childNodes — stay valid: mutating a later segment
    // never shifts the position of nodes before it.
    for (var s = segments.length - 1; s >= 0; s--) {
      var nodes = segments[s];
      if (!nodes.length) continue;
      var boundaries = getSegmentLineBoundaries(block, nodes);
      if (!boundaries) continue;
      anySplit = true;

      var ranges = [];
      for (var i = 0; i < boundaries.length - 1; i++) {
        var r = document.createRange();
        r.setStart(boundaries[i].node, boundaries[i].offset);
        r.setEnd(boundaries[i + 1].node, boundaries[i + 1].offset);
        ranges.push(r);
      }
      // Extract from the last line backwards so earlier ranges' node
      // references are never invalidated by a later extraction.
      for (var j = ranges.length - 1; j >= 0; j--) {
        var frag = ranges[j].extractContents();
        var span = document.createElement('span');
        span.className = 'line-drift';
        span.appendChild(frag);
        ranges[j].insertNode(span);
      }
    }
    // A line boundary landing exactly at a <b>/<i> edge can leave an empty
    // clone of it stranded between two line spans — inert, but tidy it up.
    Array.prototype.slice.call(block.querySelectorAll('b, i, strong, em')).forEach(function (el) {
      if (!el.textContent) el.remove();
    });
    return anySplit;
  }

  function applyDrift(block, canvas, maxPercent) {
    var lines = Array.prototype.slice.call(block.querySelectorAll(':scope > .line-drift'));
    var n = lines.length;
    if (!n) return;
    // Left-aligned lines always start flush at the block's own left edge,
    // so clamping against the block itself gives zero leftward room by
    // construction. Clamp against the wider canvas (text-content, padded
    // on both sides) instead — that padding is exactly the "how far can a
    // line drift" budget, symmetric in both directions.
    var canvasRect = canvas.getBoundingClientRect();
    var refWidth = canvasRect.width;
    var maxStep = refWidth * maxPercent;

    // A tilt doesn't sit in isolation — like a hand pressed on a stack of
    // paper, it pulls the nearer lines along with it, at less and less
    // strength the further away they are, rather than leaving them flat
    // around one interrupted line. Decided as one up-front pass so a
    // line's pull can come from a source before OR after it, before any
    // line is actually processed below.
    var rawAngles = new Array(n).fill(0);
    var spread = [[0, 1], [1, 0.55], [2, 0.22]];
    for (var i = 0; i < n; i++) {
      if (Math.random() < 0.12) {
        var sign = Math.random() < 0.5 ? -1 : 1;
        var base = rand(1, 2.2);
        spread.forEach(function (pair) {
          var dist = pair[0], weight = pair[1];
          if (dist === 0) { rawAngles[i] += sign * base * weight; return; }
          if (i - dist >= 0) rawAngles[i - dist] += sign * base * weight;
          if (i + dist < n) rawAngles[i + dist] += sign * base * weight;
        });
      }
    }

    var offset = 0;
    lines.forEach(function (line, i) {
      var lineRect = line.getBoundingClientRect();
      var slackRight = canvasRect.right - lineRect.right;
      var slackLeft = lineRect.left - canvasRect.left;
      var proposed = offset + rand(-maxStep, maxStep);
      proposed = Math.max(-slackLeft, Math.min(slackRight, proposed));
      offset = proposed;

      // Lines otherwise pack with zero natural gap, so a rotated line's
      // bounding box would reach straight into its neighbour's — reserving
      // that reach as real padding is what keeps them apart. That padding
      // has to live on an unrotated OUTER wrapper with the rotation on an
      // INNER one sized only to the natural content: rotating the padded
      // box itself would rotate the padding too, adding reach on top of
      // the space meant to absorb it.
      //
      // The budget is fixed and small — the paragraph must always look
      // tight — so it's the angle that gives way to fit it, not the other
      // way around: the more a line is pulled toward tilting, the harder
      // it gets reined in on a wide line (little of that pull actually
      // shows), while the same small budget lets a short line lean much
      // further. A raw pull from propagation is a request, not a
      // guarantee.
      var tilt = 0;
      if (rawAngles[i] !== 0 && lineRect.width > 0) {
        var buffer = 3;
        var maxAngle = Math.min(2.5, Math.asin(Math.min(1, (2 * buffer) / lineRect.width)) * (180 / Math.PI));
        var sign2 = rawAngles[i] > 0 ? 1 : -1;
        tilt = sign2 * Math.min(Math.abs(rawAngles[i]), maxAngle);
        line.style.paddingTop = buffer + 'px';
        line.style.paddingBottom = buffer + 'px';
        var inner = document.createElement('span');
        inner.className = 'line-tilt';
        while (line.firstChild) inner.appendChild(line.firstChild);
        line.appendChild(inner);
        inner.style.transform = 'rotate(' + tilt.toFixed(2) + 'deg)';
      }

      line.style.transform = 'translateX(' + offset.toFixed(1) + 'px)';
    });
  }

  // Bold is never rendered bold — every letter gets individually offset,
  // whether the bold span is a single word or a whole phrase. A plain space
  // is kept as a real text node (not wrapped in its own glyph span) so word
  // gaps stay visible and a scattered phrase still wraps normally at word
  // boundaries, same as ordinary text.
  function scatterBoldGlyphs(el) {
    var text = el.textContent;
    el.textContent = '';
    el.classList.add('accident-word');
    for (var i = 0; i < text.length; i++) {
      var ch = text[i];
      if (ch === ' ') {
        el.appendChild(document.createTextNode(' '));
        continue;
      }
      var g = document.createElement('span');
      g.className = 'glyph';
      g.textContent = ch;
      var rot = rand(-12, 12), ty = rand(-3, 3);
      g.style.transform = 'translateY(' + ty.toFixed(1) + 'px) rotate(' + rot.toFixed(1) + 'deg)';
      el.appendChild(g);
    }
  }

  function processBoldWithinLines(container) {
    container.querySelectorAll('b, strong').forEach(scatterBoldGlyphs);
  }

  function processAccidents(container) {
    // Any block that wraps its own text independently — paragraphs and
    // list items alike — gets split into its real rendered lines and drifted,
    // then any bold spans left inside those lines get their own treatment.
    container.querySelectorAll('p, li').forEach(function (block) {
      splitBlockIntoLines(block);
      applyDrift(block, container, 0.10);
    });
    processBoldWithinLines(container);
  }

  // Site title: every letter gets its own small vertical + horizontal
  // offset and tilt, and the whole title also tilts slightly as a block —
  // re-rolled on every page load, same as the text accidents above.
  function renderTitleAccident(el) {
    var text = el.textContent;
    el.textContent = '';
    var rot = rand(-4, 4);
    el.style.transform = 'rotate(' + rot.toFixed(2) + 'deg)';
    for (var i = 0; i < text.length; i++) {
      var g = document.createElement('span');
      g.className = 'title-glyph';
      // A bare space inside an inline-block collapses to zero width in most
      // browsers — a non-breaking space keeps the word gap real.
      g.textContent = text[i] === ' ' ? ' ' : text[i];
      // The irregular gap is a real margin, not a transform: transforms are
      // paint-only and don't push neighbours apart, so relying on the wobble
      // alone let adjacent letters land on top of each other. This margin is
      // what actually spaces them; the small translate is just added jitter.
      g.style.marginRight = rand(1, 9).toFixed(1) + 'px';
      var tx = rand(-1.5, 1.5), ty = rand(-6, 6), gr = rand(-8, 8);
      g.style.transform = 'translate(' + tx.toFixed(1) + 'px,' + ty.toFixed(1) + 'px) rotate(' + gr.toFixed(1) + 'deg)';
      el.appendChild(g);
    }
  }

  // Blank, column-aligned filler blocks — re-rolled on every page load so
  // the layout never packs identically twice.
  function renderSpacer() {
    var span = Math.random() < 0.25 ? 2 : 1;
    var height = 60 + Math.floor(Math.random() * 220);
    return '<div class="card spacer" data-span="' + span + '" style="height: ' + height + 'px;" aria-hidden="true"></div>';
  }

  // ---- Masonry packing (exact pixel positioning, no rounding) ----
  // Each card gets a precise top/left in JS — column choice follows the
  // same rules as before (shortest column, wide cards prefer an already
  // level pair, text never lands directly on top of text) — only the
  // actual placement math changed, from a rounded CSS-grid row hack to
  // exact pixels, so the gap between any two cards is always --feed-gap.
  function layoutMasonry() {
    var feed = document.querySelector('.feed');
    if (!feed) return;
    var styles = getComputedStyle(feed);
    var gap = parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--feed-gap')) || 16;
    var feedPad = parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--feed-pad')) || 0;
    var outerWidth = feed.clientWidth; // includes left/right padding
    var containerWidth = outerWidth - feedPad * 2;
    var colTarget = 240;
    var colCount = Math.max(1, Math.floor((containerWidth + gap) / (colTarget + gap)));
    var colWidth = (containerWidth - gap * (colCount - 1)) / colCount;

    var cards = Array.prototype.slice.call(feed.children);

    var spans = cards.map(function (card) {
      var isFull = card.classList.contains('full');
      if (isFull) return colCount;
      var wantsWide = card.classList.contains('text') || card.classList.contains('img-large')
        || card.getAttribute('data-span') === '2';
      return Math.min(wantsWide ? 2 : 1, colCount);
    });

    // Pass 1: set each card's exact width so its natural height (text
    // wrap, image aspect ratio) measures correctly.
    cards.forEach(function (card, i) {
      var isFull = card.classList.contains('full');
      var w = isFull ? outerWidth : spans[i] * colWidth + (spans[i] - 1) * gap;
      card.style.width = w + 'px';
    });
    // Re-derive the accidents now that each card has its real width — a
    // resize can change where a bold word or a line breaks, so we always
    // reset to the pristine HTML first rather than re-processing already
    // fragmented spans. This must happen before heights are measured: a
    // bold word's white-space:nowrap can push it entirely onto the next
    // line, changing the paragraph's total line count (and so its height)
    // versus how it would have wrapped as plain inline text — measuring
    // first and decorating after would size the column packing for a
    // shorter card than what actually renders, producing overlaps.
    feed.querySelectorAll('.text-content').forEach(function (el) {
      if (textOriginals.has(el)) el.innerHTML = textOriginals.get(el);
      processAccidents(el);
    });
    var heights = cards.map(function (card) { return card.getBoundingClientRect().height; });

    // Pass 2: assign each card to explicit columns + an exact pixel top.
    var colHeights = new Array(colCount).fill(0);
    var colLastType = new Array(colCount).fill(null);

    cards.forEach(function (card, i) {
      var isText = card.classList.contains('text');
      var isFull = card.classList.contains('full');
      var span = spans[i];
      var height = heights[i];

      var start, stillBlocked = false;
      if (span >= colCount) {
        start = 0;
      } else if (span === 1) {
        start = colHeights.indexOf(Math.min.apply(null, colHeights));
      } else {
        // A wide card starts at the tallest column it spans, leaving a
        // notch in the shorter one whenever the pair isn't already level.
        // Rank candidates by imbalance first (so a level pair always wins
        // over a merely-shorter one) and only use total height to break
        // ties between equally level candidates.
        var bestStart = 0, bestImbalance = Infinity, bestMax = Infinity, bestBlocked = true;
        for (var s = 0; s + span <= colCount; s++) {
          var segment = colHeights.slice(s, s + span);
          var segMax = Math.max.apply(null, segment);
          var segMin = Math.min.apply(null, segment);
          var imbalance = segMax - segMin;
          var blocked = isText && colLastType.slice(s, s + span).indexOf('text') !== -1;
          var better = blocked !== bestBlocked
            ? (bestBlocked && !blocked)
            : (imbalance < bestImbalance) || (imbalance === bestImbalance && segMax < bestMax);
          if (better) { bestImbalance = imbalance; bestMax = segMax; bestStart = s; bestBlocked = blocked; }
        }
        start = bestStart;
        stillBlocked = bestBlocked; // every pair had a text neighbour — rare, but possible
      }

      var top = 0;
      for (var k = start; k < start + span; k++) top = Math.max(top, colHeights[k]);
      // Even in that rare case, don't let it read as one continuous block —
      // force a visible break instead of just the normal gap.
      if (stillBlocked) top += 50 + Math.floor(Math.random() * 80);

      var left = isFull ? 0 : feedPad + start * (colWidth + gap);
      card.style.left = left + 'px';
      card.style.top = top + 'px';

      var newHeight = top + height + gap;
      var type = isText ? 'text' : (card.classList.contains('spacer') ? null : 'other');
      for (var k2 = start; k2 < start + span; k2++) {
        colHeights[k2] = newHeight;
        colLastType[k2] = type;
      }
    });

    var maxHeight = Math.max.apply(null, colHeights.concat([0]));
    feed.style.height = (maxHeight + 64) + 'px';
  }

  function waitForImages(container) {
    var imgs = Array.prototype.slice.call(container.querySelectorAll('img'));
    return Promise.all(imgs.map(function (img) {
      if (img.complete) return Promise.resolve();
      return new Promise(function (resolve) {
        img.addEventListener('load', resolve, { once: true });
        img.addEventListener('error', resolve, { once: true });
      });
    }));
  }

  var resizeTimer;
  window.addEventListener('resize', function () {
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(layoutMasonry, 150);
  });

  function render() {
    document.title = siteData.siteTitle || 'Mon site';
    var posts = sortedPosts();
    // Re-rolled every load, so how sparse or busy the blank blocks feel
    // varies from one visit to the next. Keeping two text posts apart is
    // handled by layoutMasonry's column routing.
    var spacerChance = 0.15 + Math.random() * 0.35;
    var cards = posts.map(function (post) {
      var spacer = Math.random() < spacerChance ? renderSpacer() : '';
      return spacer + renderCard(post);
    }).join('');

    document.getElementById('app').innerHTML =
      '<header class="site-header"><div class="site-title">' + escapeHtml(siteData.siteTitle || 'Mon site') + '</div></header>' +
      (cards
        ? '<main class="feed">' + cards + '</main>'
        : '<p class="muted">Aucun contenu pour le moment.</p>');

    var titleEl = document.querySelector('.site-title');
    if (titleEl) renderTitleAccident(titleEl);

    var feed = document.querySelector('.feed');
    if (feed) {
      feed.querySelectorAll('.text-content').forEach(function (el) {
        textOriginals.set(el, el.innerHTML);
      });
      waitForImages(feed).then(layoutMasonry);
    }
  }

  fetch('data.json', { cache: 'no-store' })
    .then(function (res) {
      if (!res.ok) throw new Error('data.json introuvable');
      return res.json();
    })
    .then(function (data) {
      siteData = data;
      render();
    })
    .catch(function (e) {
      document.getElementById('app').innerHTML =
        '<div class="muted" style="padding-top:40px;">Impossible de charger data.json. ' +
        'Vérifiez qu\'il se trouve bien à côté de ce fichier index.html.<br><small>' +
        escapeHtml(e.message) + '</small></div>';
    });
})();
</script>

</body>
</html>
