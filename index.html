<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mon site</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; background: #fff; color: #111; }
  body { font-family: Georgia, 'Times New Roman', Times, serif; line-height: 1.6; }
  a { color: inherit; }

  .app { display: flex; min-height: 100vh; }

  .sidebar {
    width: 220px; flex: none;
    padding: 56px 30px; display: flex; flex-direction: column; gap: 34px;
  }
  .site-title {
    font-family: Helvetica, Arial, sans-serif; font-weight: 700; font-size: 12px;
    letter-spacing: 0.08em; text-transform: uppercase; word-break: break-word;
  }
  .nav-list { display: flex; flex-direction: column; gap: 12px; }
  .nav-link {
    font-family: Helvetica, Arial, sans-serif; font-weight: 700; font-size: 11px;
    letter-spacing: 0.08em; text-transform: uppercase;
    display: block; text-decoration: none; color: #888;
  }
  .nav-link:hover { color: #111; }
  .nav-link.current { color: #111; }

  .content { flex: 1; padding: 64px 48px; }
  .content-inner { max-width: 640px; }
  .content h1 {
    font-family: Helvetica, Arial, sans-serif; font-weight: 700; font-size: 11px;
    letter-spacing: 0.08em; text-transform: uppercase; margin: 0 0 30px 0; color: #888;
  }
  .muted { font-style: italic; }

  .page-body { font-size: 17px; }
  .page-body p { margin: 0 0 18px 0; }
  .page-body h2 { font-family: Georgia, 'Times New Roman', Times, serif; font-weight: 400; font-size: 25px; margin: 36px 0 14px 0; }
  .page-body h3 {
    font-family: Helvetica, Arial, sans-serif; font-weight: 700; font-size: 11px;
    letter-spacing: 0.08em; text-transform: uppercase; color: #888; margin: 30px 0 10px 0;
  }
  .page-body blockquote { margin: 22px 0; padding: 0; font-style: italic; }
  .page-body ul, .page-body ol { margin: 0 0 18px 0; padding-left: 22px; }
  .page-body a { text-decoration: underline; }

  .page-body img { max-width: 100%; height: auto; display: block; margin: 30px 0 0 0; }
  .page-body p.caption { font-family: Helvetica, Arial, sans-serif; font-size: 12px; color: #888; margin: 8px 0 30px 0; }

  figure.site-figure { margin: 30px 0; }
  figure.site-figure img { max-width: 100%; height: auto; display: block; margin: 0; }
  figure.site-figure figcaption { font-family: Helvetica, Arial, sans-serif; font-size: 12px; color: #888; margin-top: 8px; }

  @media (max-width: 680px) {
    .app { flex-direction: column; }
    .sidebar { width: 100%; padding: 32px 22px; gap: 20px; }
    .content { padding: 36px 22px; }
  }
</style>
</head>
<body>

<div id="app"><div style="padding:40px;font-style:italic;">Chargement…</div></div>

<script>
(function () {
  var siteData = null;

  function escapeHtml(str) {
    var d = document.createElement('div');
    d.textContent = str == null ? '' : String(str);
    return d.innerHTML;
  }

  // Retries images that briefly 404 right after GitHub Pages redeploys.
  window.handleImgError = function (img) {
    var tries = parseInt(img.getAttribute('data-retry') || '0', 10);
    if (tries >= 15) return;
    img.setAttribute('data-retry', String(tries + 1));
    var base = img.getAttribute('data-base-src') || img.src;
    img.setAttribute('data-base-src', base);
    setTimeout(function () { img.src = base + '?r=' + Date.now(); }, 4000);
  };

  function visiblePages() {
    return (siteData.pages || []).filter(function (p) { return p.visible !== false; });
  }

  function currentSlug() {
    var h = location.hash.replace(/^#/, '');
    var vis = visiblePages();
    if (h && vis.some(function (p) { return p.slug === h; })) return h;
    return vis[0] && vis[0].slug;
  }

  function findPage(slug) {
    var list = visiblePages();
    for (var i = 0; i < list.length; i++) if (list[i].slug === slug) return list[i];
    return list[0];
  }

  function render() {
    document.title = siteData.siteTitle || 'Mon site';
    var slug = currentSlug();
    var page = findPage(slug);
    if (!page) {
      document.getElementById('app').innerHTML = '<div style="padding:40px;">Aucune page.</div>';
      return;
    }

    var nav = visiblePages().map(function (p) {
      var cls = p.slug === page.slug ? 'nav-link current' : 'nav-link';
      return '<a class="' + cls + '" href="#' + p.slug + '">' + escapeHtml(p.title) + '</a>';
    }).join('');

    document.getElementById('app').innerHTML =
      '<div class="app">' +
        '<div class="sidebar">' +
          '<div class="site-title">' + escapeHtml(siteData.siteTitle || 'Mon site') + '</div>' +
          '<nav class="nav-list">' + nav + '</nav>' +
        '</div>' +
        '<div class="content"><div class="content-inner">' +
          '<h1>' + escapeHtml(page.title) + '</h1>' +
          '<div class="page-body">' + (page.content || '') + '</div>' +
        '</div></div>' +
      '</div>';
  }

  window.addEventListener('hashchange', render);

  fetch('data.json', { cache: 'no-store' })
    .then(function (res) {
      if (!res.ok) throw new Error('data.json introuvable');
      return res.json();
    })
    .then(function (data) {
      siteData = data;
      render();
    })
    .catch(function (e) {
      document.getElementById('app').innerHTML =
        '<div style="padding:40px;">Impossible de charger data.json. ' +
        'Vérifiez qu\'il se trouve bien à côté de ce fichier index.html.<br><small>' +
        escapeHtml(e.message) + '</small></div>';
    });
})();
</script>

</body>
</html>
