<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Backoffice</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; background: #fff; color: #000; }
  body { font-family: Arial, Helvetica, sans-serif; line-height: 1.5; }
  a { color: #000; }

  .app { display: flex; min-height: 100vh; }
  .app-loading .content, .app-loading .sidebar { visibility: hidden; }
  .loading-screen { padding: 60px 40px; max-width: 480px; }
  .loading-screen button {
    border: 1px solid #000; background: #fff; color: #000;
    padding: 10px 16px; font-family: inherit; font-size: 14px; cursor: pointer; margin-top: 14px;
  }
  .loading-screen button:hover { background: #000; color: #fff; }

  .sidebar {
    width: 260px; flex: none;
    padding: 24px 18px; display: flex; flex-direction: column; gap: 14px;
  }
  .site-title-row { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; }
  .site-title {
    font-family: Arial, Helvetica, sans-serif; font-size: 1em; font-weight: 400;
    text-transform: uppercase; word-break: break-word;
  }
  .rename-btn, .small-btn {
    border: 1px solid #000; background: #fff; color: #000;
    font-size: 11px; padding: 2px 6px; cursor: pointer; font-family: inherit;
  }
  .rename-btn:hover, .small-btn:hover { background: #000; color: #fff; }

  .add-page-btn, .publish-btn {
    width: 100%; border: 1px solid #000; background: #fff; color: #000;
    padding: 8px; font-family: inherit; font-size: 13px; cursor: pointer;
  }
  .publish-btn:hover { background: #000; color: #fff; }
  .publish-btn:disabled { opacity: 0.4; cursor: default; }
  .publish-btn:disabled:hover { background: #fff; color: #000; }

  .status { font-size: 11px; font-style: italic; min-height: 28px; }
  .status.dirty { font-style: normal; }

  .content { flex: 1; padding: 56px 48px; }
  .content-inner { max-width: 680px; }
  .content h1 {
    font-family: Arial, Helvetica, sans-serif; font-size: 1em; font-weight: 400;
    text-transform: uppercase; margin: 0 0 24px 0;
  }
  .muted { font-style: normal; }

  .type-toggle { display: flex; gap: 16px; margin-bottom: 20px; }
  .type-toggle button {
    border: none; background: none; color: #000; font-family: inherit; font-size: 14px;
    padding: 0; cursor: pointer; text-decoration: none;
  }
  .type-toggle button.active { text-decoration: underline; }

  .field { margin-bottom: 16px; }
  .field label {
    display: block; font-size: 11px; text-transform: uppercase; margin-bottom: 4px;
  }
  .field input[type="text"], .field input[type="date"] {
    width: 100%; font-family: inherit; font-size: 14px; border: 1px solid #000;
    padding: 6px 8px; background: #fff; color: #000;
  }
  .fields-row { display: flex; gap: 16px; flex-wrap: wrap; }
  .fields-row .field { flex: 1; min-width: 160px; }

  .toolbar { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 18px; padding-bottom: 14px; border-bottom: 1px solid #000; }
  .toolbar button { border: 1px solid #000; background: #fff; color: #000; font-family: inherit; font-size: 12px; padding: 5px 9px; cursor: pointer; }
  .toolbar button:hover { background: #000; color: #fff; }

  .editor {
    min-height: 200px; outline: none; font-family: Arial, Helvetica, sans-serif; font-size: 16px;
    line-height: 1.3; border: 1px solid #000; padding: 12px;
  }
  .editor:focus { outline: 1px dotted #000; }
  .editor p { margin: 0 0 18px 0; }
  .editor h1, .editor h2, .editor h3 { font-size: 1em; font-weight: 400; margin: 0 0 18px 0; }
  .editor blockquote { font-weight: 400; margin: 38px 0 22px 0; padding: 0; }
  .editor ul, .editor ol { margin: 0 0 18px 0; padding-left: 22px; }
  .editor a { font-family: 'Times New Roman', Times, serif; font-style: italic; text-decoration: underline; }
  .editor > *:first-child { margin-top: 0; }

  .drop-zone {
    border: 1px dashed #000; padding: 40px 20px; text-align: center; cursor: pointer;
    font-size: 13px;
  }
  .drop-zone.drag-over { border-style: solid; }
  .image-preview { margin-bottom: 12px; }
  .image-preview img { max-width: 100%; height: auto; display: block; border: 1px solid #000; }
  .image-preview .small-btn { margin-top: 8px; }

  .upload-status { font-size: 13px; font-style: italic; margin: 0 0 10px 0; }

  .composer-actions { display: flex; gap: 10px; margin-top: 20px; }
  .composer-actions button {
    border: 1px solid #000; background: #fff; color: #000; font-family: inherit;
    font-size: 13px; padding: 8px 14px; cursor: pointer;
  }
  .composer-actions button:hover { background: #000; color: #fff; }

  .post-list { margin-top: 56px; padding-top: 24px; border-top: 1px solid #000; }
  .post-row { display: flex; gap: 14px; align-items: flex-start; padding: 14px 0; border-bottom: 1px solid #000; }
  .post-row .thumb { width: 56px; height: 56px; flex: none; object-fit: cover; border: 1px solid #000; }
  .post-row .thumb-placeholder { width: 56px; height: 56px; flex: none; border: 1px solid #000; }
  .post-row .row-body { flex: 1; min-width: 0; }
  .post-row .row-meta { font-size: 11px; text-transform: uppercase; margin-bottom: 4px; }
  .post-row .row-snippet {
    font-family: 'Times New Roman', Times, serif; font-size: 14px;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .post-row .row-actions { flex: none; display: flex; gap: 8px; }
  .post-row .row-actions button {
    border: 1px solid #000; background: #fff; color: #000; font-family: inherit;
    font-size: 11px; padding: 3px 8px; cursor: pointer;
  }
  .post-row .row-actions button:hover { background: #000; color: #fff; }

  @media (max-width: 680px) {
    .app { flex-direction: column; }
    .sidebar { width: 100%; }
    .content { padding: 28px 20px; }
  }
</style>
</head>
<body>

<div id="app" class="app app-loading">
  <div class="loading-screen">Chargement…</div>
</div>

<script>
(function () {
  var CONFIG_KEY = 'site-admin-github-config';
  var config = null;      // {owner, repo, branch, path, token}
  var lastSha = null;
  var siteTitle = 'Mon site';
  var categories = [];    // string[]
  var projects = [];      // string[]
  var posts = [];         // [{id, type, date, category, project, content, src, caption, createdAt}]
  var editingPostId = null;
  var draft = null;
  var hasUnsavedChanges = false;

  // ---------- Helpers ----------
  function genId() {
    if (window.crypto && crypto.randomUUID) return crypto.randomUUID();
    return 'p' + Date.now().toString(16) + Math.random().toString(16).slice(2);
  }
  function todayStr() {
    var d = new Date();
    var m = String(d.getMonth() + 1).padStart(2, '0');
    var day = String(d.getDate()).padStart(2, '0');
    return d.getFullYear() + '-' + m + '-' + day;
  }
  function blankDraft() {
    return { type: 'text', date: todayStr(), category: '', project: '', content: '<p><br></p>', src: null, caption: '' };
  }
  function escapeHtml(str) {
    var d = document.createElement('div');
    d.textContent = str == null ? '' : String(str);
    return d.innerHTML;
  }
  function escapeAttr(str) {
    return escapeHtml(str).replace(/"/g, '&quot;').replace(/'/g, '&#39;');
  }
  function b64DecodeUtf8(b64) { return decodeURIComponent(escape(atob(b64.replace(/\n/g, '')))); }
  function b64EncodeUtf8(str) { return btoa(unescape(encodeURIComponent(str))); }
  function apiUrl() { return 'https://api.github.com/repos/' + config.owner + '/' + config.repo + '/contents/' + config.path; }
  function authHeaders() { return { 'Authorization': 'Bearer ' + config.token, 'Accept': 'application/vnd.github+json' }; }

  function setStatus(text, dirty) {
    var el = document.getElementById('status');
    if (el) { el.textContent = text; el.className = 'status' + (dirty ? ' dirty' : ''); }
  }
  function markDirty() {
    hasUnsavedChanges = true;
    setStatus('Modifications non publiées', true);
    var btn = document.getElementById('publish-btn');
    if (btn) btn.disabled = false;
  }

  window.addEventListener('beforeunload', function (e) {
    if (hasUnsavedChanges) { e.preventDefault(); e.returnValue = ''; }
  });

  // ---------- Config ----------
  function loadConfig() {
    try {
      var raw = localStorage.getItem(CONFIG_KEY);
      return raw ? JSON.parse(raw) : null;
    } catch (e) { return null; }
  }
  function saveConfig() {
    try { localStorage.setItem(CONFIG_KEY, JSON.stringify(config)); } catch (e) {}
  }

  window.configureGithub = function () {
    var owner = prompt('Utilisateur ou organisation GitHub :', (config && config.owner) || '');
    if (!owner) return;
    var repo = prompt('Nom du dépôt :', (config && config.repo) || '');
    if (!repo) return;
    var branch = prompt('Branche :', (config && config.branch) || 'main');
    if (!branch) return;
    var path = prompt('Chemin du fichier JSON dans le dépôt :', (config && config.path) || 'data.json');
    if (!path) return;
    var token = prompt(
      'Jeton d\'accès personnel GitHub (fine-grained, limité à ce dépôt, permission "Contents: Read and write") :',
      ''
    );
    if (!token) return;
    config = { owner: owner.trim(), repo: repo.trim(), branch: branch.trim(), path: path.trim(), token: token.trim() };
    saveConfig();
    boot();
  };

  // ---------- Load / Save via GitHub ----------
  function loadSiteFromGithub() {
    return fetch(apiUrl() + '?ref=' + encodeURIComponent(config.branch), { headers: authHeaders() })
      .then(function (res) {
        if (res.status === 404) { lastSha = null; siteTitle = 'Mon site'; categories = []; projects = []; posts = []; return; }
        if (!res.ok) throw new Error('Code ' + res.status + ' — vérifiez la configuration et le jeton.');
        return res.json().then(function (json) {
          lastSha = json.sha;
          var data = JSON.parse(b64DecodeUtf8(json.content));
          siteTitle = data.siteTitle || 'Mon site';
          categories = Array.isArray(data.categories) ? data.categories : [];
          projects = Array.isArray(data.projects) ? data.projects : [];
          posts = Array.isArray(data.posts) ? data.posts.map(function (p) {
            return {
              id: p.id || genId(), type: p.type === 'image' ? 'image' : 'text',
              date: p.date || todayStr(), category: p.category || '', project: p.project || '',
              content: p.content || '', src: p.src || null, caption: p.caption || '',
              createdAt: p.createdAt || 0
            };
          }) : [];
        });
      });
  }

  window.publishToGithub = function () {
    var jsonStr = JSON.stringify({ siteTitle: siteTitle, categories: categories, projects: projects, posts: posts }, null, 2);
    setStatus('Publication…', false);
    fetch(apiUrl() + '?ref=' + encodeURIComponent(config.branch), { headers: authHeaders() })
      .then(function (res) {
        if (res.status === 404) return null;
        if (!res.ok) return res.json().then(function (j) { throw new Error(j.message || ('Code ' + res.status)); });
        return res.json().then(function (j) { return j.sha; });
      })
      .then(function (sha) {
        lastSha = sha;
        return fetch(apiUrl(), {
          method: 'PUT',
          headers: Object.assign({ 'Content-Type': 'application/json' }, authHeaders()),
          body: JSON.stringify({
            message: 'Mise à jour du site — ' + new Date().toISOString(),
            content: b64EncodeUtf8(jsonStr),
            branch: config.branch,
            sha: lastSha || undefined
          })
        });
      })
      .then(function (res) {
        if (!res.ok) return res.json().then(function (j) { throw new Error(j.message || ('Code ' + res.status)); });
        return res.json();
      })
      .then(function (json) {
        lastSha = json.content.sha;
        hasUnsavedChanges = false;
        setStatus('Publié ✓ — en ligne sur votre site', false);
        var btn = document.getElementById('publish-btn');
        if (btn) btn.disabled = true;
      })
      .catch(function (e) {
        console.error(e);
        alert('Échec de la publication : ' + e.message);
        setStatus('Échec : ' + e.message, true);
      });
  };

  window.downloadBackup = function () {
    var jsonStr = JSON.stringify({ siteTitle: siteTitle, categories: categories, projects: projects, posts: posts }, null, 2);
    var blob = new Blob([jsonStr], { type: 'application/json' });
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url; a.download = 'data.json';
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    URL.revokeObjectURL(url);
  };

  window.renameSite = function () {
    var val = prompt('Titre du site :', siteTitle);
    if (val && val.trim()) { siteTitle = val.trim(); markDirty(); render(); }
  };

  // ---------- Draft (composer) ----------
  window.setDraftType = function (type) {
    if (draft.type === type) return;
    var hasContent = draft.type === 'text'
      ? stripHtml(draft.content).length > 0
      : !!draft.src;
    if (hasContent && !confirm('Changer de type effacera le contenu en cours de saisie. Continuer ?')) return;
    draft.type = type;
    // Switching type discards the other type's in-progress content, so a
    // half-written text draft can't silently get attached to an image post.
    draft.content = '<p><br></p>';
    draft.src = null;
    draft.caption = '';
    render();
  };

  window.updateDraftField = function (field, value) {
    draft[field] = value;
  };

  function getEditorEl() { return document.getElementById('editor'); }

  window.onDraftContentChanged = function (el) {
    el = el || getEditorEl();
    if (!el) return;
    draft.content = el.innerHTML;
  };

  function exec(cmd, val) {
    var el = getEditorEl();
    if (!el) return;
    el.focus();
    document.execCommand(cmd, false, val || null);
    window.onDraftContentChanged(el);
  }
  window.cmdBold = function () { exec('bold'); };
  window.cmdItalic = function () { exec('italic'); };
  window.cmdQuote = function () { exec('formatBlock', 'BLOCKQUOTE'); };
  window.cmdList = function () { exec('insertUnorderedList'); };
  window.cmdLinkExternal = function () {
    var url = prompt('Adresse (URL) du lien :', 'https://');
    if (!url) return;
    exec('createLink', url);
  };

  function addToList(list, value) {
    var v = (value || '').trim();
    if (!v) return;
    var exists = list.some(function (x) { return x.toLowerCase() === v.toLowerCase(); });
    if (!exists) { list.push(v); list.sort(function (a, b) { return a.localeCompare(b); }); }
  }

  window.saveDraftPost = function () {
    draft.category = (draft.category || '').trim();
    draft.project = (draft.project || '').trim();
    draft.date = draft.date || todayStr();
    if (draft.type === 'image' && !draft.src) { alert('Ajoutez une image avant d\'enregistrer.'); return; }
    if (draft.type === 'text') {
      var el = getEditorEl();
      if (el) draft.content = el.innerHTML;
      var text = el ? el.textContent.trim() : '';
      if (!text) { alert('Le texte du post est vide.'); return; }
    }

    addToList(categories, draft.category);
    addToList(projects, draft.project);

    if (editingPostId) {
      var post = posts.filter(function (p) { return p.id === editingPostId; })[0];
      if (post) {
        post.type = draft.type; post.date = draft.date; post.category = draft.category;
        post.project = draft.project; post.content = draft.content; post.src = draft.src; post.caption = draft.caption;
      }
    } else {
      posts.push({
        id: genId(), type: draft.type, date: draft.date, category: draft.category,
        project: draft.project, content: draft.content, src: draft.src, caption: draft.caption,
        createdAt: Date.now()
      });
    }

    editingPostId = null;
    draft = blankDraft();
    markDirty();
    render();
  };

  window.editPost = function (id) {
    var post = posts.filter(function (p) { return p.id === id; })[0];
    if (!post) return;
    editingPostId = id;
    draft = {
      type: post.type, date: post.date, category: post.category, project: post.project,
      content: post.content, src: post.src, caption: post.caption
    };
    render();
    var content = document.querySelector('.content');
    if (content) content.scrollIntoView({ block: 'start' });
  };

  window.cancelEdit = function () {
    editingPostId = null;
    draft = blankDraft();
    render();
  };

  window.deletePost = function (id) {
    var post = posts.filter(function (p) { return p.id === id; })[0];
    if (!post || !confirm('Supprimer ce post ?')) return;
    posts = posts.filter(function (p) { return p.id !== id; });
    if (editingPostId === id) { editingPostId = null; draft = blankDraft(); }
    markDirty();
    render();
  };

  // ---------- Image upload (stored as files in the repo, not inline base64) ----------
  function contentsUrl(path) { return 'https://api.github.com/repos/' + config.owner + '/' + config.repo + '/contents/' + path; }

  function fileToBase64(file) {
    return new Promise(function (resolve, reject) {
      var reader = new FileReader();
      reader.onload = function () { resolve(reader.result.split(',')[1]); };
      reader.onerror = function () { reject(new Error('Lecture du fichier impossible.')); };
      reader.readAsDataURL(file);
    });
  }

  function extForFile(file) {
    var m = /\.([a-zA-Z0-9]+)$/.exec(file.name || '');
    if (m) return m[1].toLowerCase();
    var byType = { 'image/png': 'png', 'image/jpeg': 'jpg', 'image/gif': 'gif', 'image/webp': 'webp', 'image/svg+xml': 'svg' };
    return byType[file.type] || 'png';
  }

  function uploadImageToGithub(file) {
    var name = Date.now().toString(36) + Math.random().toString(36).slice(2, 8) + '.' + extForFile(file);
    var path = 'images/' + name;
    return fileToBase64(file).then(function (base64) {
      return fetch(contentsUrl(path), {
        method: 'PUT',
        headers: Object.assign({ 'Content-Type': 'application/json' }, authHeaders()),
        body: JSON.stringify({ message: 'Ajout image — ' + name, content: base64, branch: config.branch })
      });
    }).then(function (res) {
      if (!res.ok) return res.json().then(function (j) { throw new Error(j.message || ('Code ' + res.status)); });
      return path;
    });
  }

  function showUploadStatus(msg) {
    var el = document.getElementById('upload-status');
    if (el) el.textContent = msg || '';
  }

  // GitHub Pages can take up to ~1 min to redeploy after a new file is pushed;
  // retry the image load a few times instead of leaving it broken.
  window.handleImgError = function (img) {
    var tries = parseInt(img.getAttribute('data-retry') || '0', 10);
    if (tries >= 15) return;
    img.setAttribute('data-retry', String(tries + 1));
    var base = img.getAttribute('data-base-src') || img.src;
    img.setAttribute('data-base-src', base);
    setTimeout(function () { img.src = base + '?r=' + Date.now(); }, 4000);
  };

  // ---------- EXIF date (JPEG only) ----------
  function ifdEntryOffset(view, tiffStart, ifdStart, little, targetTag) {
    var count = view.getUint16(ifdStart, little);
    for (var i = 0; i < count; i++) {
      var entry = ifdStart + 2 + i * 12;
      if (view.getUint16(entry, little) === targetTag) {
        return { count: view.getUint32(entry + 4, little), valueFieldOffset: entry + 8 };
      }
    }
    return null;
  }
  function readExifAscii(view, tiffStart, entry, little) {
    var byteLen = entry.count;
    var dataOffset = byteLen <= 4 ? entry.valueFieldOffset : tiffStart + view.getUint32(entry.valueFieldOffset, little);
    var bytes = [];
    for (var i = 0; i < byteLen; i++) {
      var b = view.getUint8(dataOffset + i);
      if (b === 0) break;
      bytes.push(b);
    }
    return String.fromCharCode.apply(null, bytes);
  }
  function extractExifDate(file) {
    return new Promise(function (resolve) {
      if (!/^image\/jpe?g$/i.test(file.type)) { resolve(null); return; }
      var reader = new FileReader();
      reader.onload = function () {
        try {
          var view = new DataView(reader.result);
          if (view.byteLength < 4 || view.getUint16(0) !== 0xFFD8) { resolve(null); return; }
          var offset = 2;
          while (offset + 4 <= view.byteLength) {
            if (view.getUint8(offset) !== 0xFF) break;
            var marker = view.getUint8(offset + 1);
            if (marker === 0x01 || (marker >= 0xD0 && marker <= 0xD7)) { offset += 2; continue; }
            if (marker === 0xD9 || marker === 0xDA) break;
            var segLen = view.getUint16(offset + 2);
            if (marker === 0xE1 && offset + 4 + 6 <= view.byteLength) {
              var appStart = offset + 4;
              if (view.getUint32(appStart) === 0x45786966 && view.getUint16(appStart + 4) === 0) {
                var tiffStart = appStart + 6;
                var little = view.getUint16(tiffStart) === 0x4949;
                var ifd0Offset = tiffStart + view.getUint32(tiffStart + 4, little);
                var dateStr = null;
                var exifPtr = ifdEntryOffset(view, tiffStart, ifd0Offset, little, 0x8769);
                if (exifPtr) {
                  var exifIFDOffset = tiffStart + view.getUint32(exifPtr.valueFieldOffset, little);
                  var dtEntry = ifdEntryOffset(view, tiffStart, exifIFDOffset, little, 0x9003);
                  if (dtEntry) dateStr = readExifAscii(view, tiffStart, dtEntry, little);
                }
                if (!dateStr) {
                  var dtEntry2 = ifdEntryOffset(view, tiffStart, ifd0Offset, little, 0x0132);
                  if (dtEntry2) dateStr = readExifAscii(view, tiffStart, dtEntry2, little);
                }
                if (dateStr) {
                  var m = /^(\d{4}):(\d{2}):(\d{2})/.exec(dateStr);
                  if (m) { resolve(m[1] + '-' + m[2] + '-' + m[3]); return; }
                }
              }
            }
            offset += 2 + segLen;
          }
          resolve(null);
        } catch (e) { resolve(null); }
      };
      reader.onerror = function () { resolve(null); };
      reader.readAsArrayBuffer(file.slice(0, 131072));
    });
  }

  function uploadDraftImageFile(file) {
    if (!/^image\//.test(file.type)) return;
    extractExifDate(file).then(function (exifDate) {
      if (exifDate) { draft.date = exifDate; render(); }
    });
    showUploadStatus('Téléversement de l\'image…');
    uploadImageToGithub(file).then(function (path) {
      draft.src = path;
      showUploadStatus('');
      render();
    }).catch(function (e) {
      console.error(e);
      showUploadStatus('');
      alert('Échec de l\'envoi de l\'image : ' + e.message);
    });
  }

  window.pickDraftImage = function () {
    var input = document.createElement('input');
    input.type = 'file'; input.accept = 'image/*';
    input.onchange = function (e) {
      var file = e.target.files[0];
      if (file) uploadDraftImageFile(file);
    };
    input.click();
  };

  window.handleDraftDragOver = function (e) {
    e.preventDefault();
    e.currentTarget.classList.add('drag-over');
  };
  window.handleDraftDragLeave = function (e) {
    e.currentTarget.classList.remove('drag-over');
  };
  window.handleDraftDrop = function (e) {
    e.preventDefault();
    e.currentTarget.classList.remove('drag-over');
    var files = e.dataTransfer && e.dataTransfer.files ? Array.prototype.slice.call(e.dataTransfer.files) : [];
    var image = files.filter(function (f) { return /^image\//.test(f.type); })[0];
    if (image) uploadDraftImageFile(image);
  };
  window.handleDraftPaste = function (e) {
    var items = e.clipboardData ? e.clipboardData.items : null;
    if (!items) return;
    for (var i = 0; i < items.length; i++) {
      if (items[i].kind === 'file' && /^image\//.test(items[i].type)) {
        e.preventDefault();
        uploadDraftImageFile(items[i].getAsFile());
        return;
      }
    }
  };

  // ---------- Render ----------
  function renderSidebar() {
    return '' +
      '<div class="sidebar">' +
        '<div class="site-title-row"><div class="site-title">' + escapeHtml(siteTitle) + '</div><button class="rename-btn" onclick="renameSite()">renommer</button></div>' +
        '<button id="publish-btn" class="publish-btn" onclick="publishToGithub()" ' + (hasUnsavedChanges ? '' : 'disabled') + '>↑ Publier sur GitHub</button>' +
        '<div class="status" id="status"' + (hasUnsavedChanges ? ' class="status dirty"' : '') + '>' + (hasUnsavedChanges ? 'Modifications non publiées' : 'À jour avec GitHub') + '</div>' +
        '<button class="small-btn" onclick="downloadBackup()">Télécharger une copie</button>' +
        '<button class="small-btn" onclick="configureGithub()">Configurer GitHub</button>' +
      '</div>';
  }

  function renderComposer() {
    var catOptions = categories.map(function (c) { return '<option value="' + escapeAttr(c) + '">'; }).join('');
    var projOptions = projects.map(function (p) { return '<option value="' + escapeAttr(p) + '">'; }).join('');

    var fields = '' +
      '<div class="fields-row">' +
        '<div class="field"><label>Date</label><input type="date" value="' + escapeAttr(draft.date) + '" oninput="updateDraftField(\'date\', this.value)"></div>' +
        '<div class="field"><label>Catégorie</label><input type="text" list="category-options" value="' + escapeAttr(draft.category) + '" oninput="updateDraftField(\'category\', this.value)"></div>' +
        '<div class="field"><label>Projet</label><input type="text" list="project-options" value="' + escapeAttr(draft.project) + '" oninput="updateDraftField(\'project\', this.value)"></div>' +
      '</div>' +
      '<datalist id="category-options">' + catOptions + '</datalist>' +
      '<datalist id="project-options">' + projOptions + '</datalist>';

    var body;
    if (draft.type === 'text') {
      body = '' +
        '<div class="toolbar">' +
          '<button onclick="cmdBold()"><b>G</b></button>' +
          '<button onclick="cmdItalic()"><i>I</i></button>' +
          '<button onclick="cmdQuote()">Citation</button>' +
          '<button onclick="cmdList()">Liste</button>' +
          '<button onclick="cmdLinkExternal()">Lien externe</button>' +
        '</div>' +
        '<div id="editor" class="editor" contenteditable="true" oninput="onDraftContentChanged(this)">' + draft.content + '</div>';
    } else {
      body = '<p class="upload-status" id="upload-status"></p>';
      if (draft.src) {
        body += '' +
          '<div class="image-preview">' +
            '<img src="' + escapeAttr(draft.src) + '" alt="" onerror="handleImgError(this)">' +
            '<button class="small-btn" onclick="pickDraftImage()">Remplacer l\'image</button>' +
          '</div>';
      } else {
        body += '' +
          '<div class="drop-zone" tabindex="0" onclick="pickDraftImage()" ' +
            'ondragover="handleDraftDragOver(event)" ondragleave="handleDraftDragLeave(event)" ' +
            'ondrop="handleDraftDrop(event)" onpaste="handleDraftPaste(event)">' +
            'Cliquer, glisser-déposer ou coller une image' +
          '</div>';
      }
      body += '<div class="field" style="margin-top:16px;"><label>Légende (facultatif)</label><input type="text" value="' + escapeAttr(draft.caption) + '" oninput="updateDraftField(\'caption\', this.value)"></div>';
    }

    return '' +
      '<h1>' + (editingPostId ? 'Modifier le post' : 'Nouveau post') + '</h1>' +
      '<div class="type-toggle">' +
        '<button class="' + (draft.type === 'text' ? 'active' : '') + '" onclick="setDraftType(\'text\')">Texte</button>' +
        '<button class="' + (draft.type === 'image' ? 'active' : '') + '" onclick="setDraftType(\'image\')">Image</button>' +
      '</div>' +
      fields +
      body +
      '<div class="composer-actions">' +
        '<button onclick="saveDraftPost()">' + (editingPostId ? 'Enregistrer' : 'Ajouter le post') + '</button>' +
        (editingPostId ? '<button onclick="cancelEdit()">Annuler</button>' : '') +
      '</div>';
  }

  function stripHtml(html) {
    var d = document.createElement('div');
    d.innerHTML = html || '';
    return (d.textContent || '').replace(/\s+/g, ' ').trim();
  }

  function renderPostList() {
    var sorted = posts.slice().sort(function (a, b) {
      if (a.date !== b.date) return a.date < b.date ? 1 : -1;
      return (b.createdAt || 0) - (a.createdAt || 0);
    });

    var rows = sorted.map(function (p) {
      var meta = [p.date, p.category, p.project].filter(Boolean).join(' · ');
      var thumb = p.type === 'image' && p.src
        ? '<img class="thumb" src="' + escapeAttr(p.src) + '" alt="" onerror="handleImgError(this)">'
        : '<div class="thumb-placeholder"></div>';
      var snippet = p.type === 'image' ? escapeHtml(p.caption || '') : escapeHtml(stripHtml(p.content));
      return '' +
        '<div class="post-row">' +
          thumb +
          '<div class="row-body">' +
            '<div class="row-meta">' + escapeHtml(meta) + '</div>' +
            '<div class="row-snippet">' + snippet + '</div>' +
          '</div>' +
          '<div class="row-actions">' +
            '<button onclick="editPost(\'' + p.id + '\')">Modifier</button>' +
            '<button onclick="deletePost(\'' + p.id + '\')">Supprimer</button>' +
          '</div>' +
        '</div>';
    }).join('');

    return '<div class="post-list">' + (rows || '<p class="muted">Aucun post.</p>') + '</div>';
  }

  function render() {
    document.title = 'Backoffice — ' + siteTitle;
    document.getElementById('app').innerHTML =
      renderSidebar() +
      '<div class="content"><div class="content-inner">' + renderComposer() + renderPostList() + '</div></div>';
  }

  function showGate(message) {
    document.getElementById('app').innerHTML =
      '<div class="loading-screen"><p>' + escapeHtml(message) + '</p><button onclick="configureGithub()">Configurer GitHub</button></div>';
  }

  function boot() {
    config = loadConfig();
    if (!config) { showGate('Backoffice non configuré. Renseignez votre dépôt GitHub pour commencer.'); return; }
    document.getElementById('app').innerHTML = '<div class="loading-screen">Chargement du site depuis GitHub…</div>';
    loadSiteFromGithub().then(function () {
      draft = blankDraft();
      document.getElementById('app').classList.remove('app-loading');
      render();
    }).catch(function (e) {
      console.error(e);
      showGate('Erreur de connexion à GitHub : ' + e.message);
    });
  }

  boot();
})();
</script>

</body>
</html>
